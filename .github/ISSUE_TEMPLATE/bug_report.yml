name: Bug report
description: Something in AOP doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: AOP version
      description: The output of `aop --version`, or the version in the desktop app's About.
      placeholder: "0.11.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where you saw it
      multiple: true
      options:
        - Host (installer, curl | sh)
        - Desktop app, macOS
        - Desktop app, Windows
        - Browser
        - iPhone app
        - Android app
        - AOP Nightly
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 26, Ubuntu 24.04, Windows 11"
  - type: input
    id: runtime
    attributes:
      label: Agent runtime
      placeholder: "Claude Code 2.x, Codex, PI"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The part of `~/.aop/logs/` that shows the failure. Remove tokens, paths or anything private first.
      render: text
