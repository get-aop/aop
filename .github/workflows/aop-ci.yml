name: AOP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: aop-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Docs facts
        run: bun run docs:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Prepare environment
        run: cp .env.example .env

      - name: Run deploy smoke tests
        run: echo "deploy smoke tests removed with the license system"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aop-ci-debug
          path: |
            bun.lock
          retention-days: 7
