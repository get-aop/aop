name: Release

# What ships:
#   - the host for macOS and Linux: aop-{linux,darwin}-{x64,arm64} plus runtime-assets.tar.gz,
#     installed by scripts/installer/install.sh (one terminal command, no installer app);
#   - the desktop app, a client of a host that launches no server on Windows: aop-macos-*.dmg and
#     aop-windows-x64-setup.exe, with the two files the installed Windows app updates itself from:
#     latest.yml and aop-windows-x64-setup.exe.blockmap (electron-updater reads them from
#     getaop.com/latest/; the macOS app only shows a notice until it is signed);
#   - the release feed on getaop.com (releases/latest.json and releases/vX.Y.Z.json), which every
#     updater reads (scripts/release/release-feed.ts).
# Windows has no host, CLI or server build.
#
# Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
#
# On a pull request, and on a manual dispatch with "publish" off (the default), the workflow builds
# and checks every artifact and stops there: nothing is published, nothing is signed, and the
# files stay as the release-all workflow artifact. Publishing (GitHub Release + Cloudflare R2)
# runs only for a v* tag push or a dispatch with "publish" on.
#
# Builds are UNSIGNED for now (decided for issue 342; signing is not settled). The signing secrets
# are only read when the repository variable AOP_SIGN_RELEASES is "true" AND the run publishes (a
# tag push or a dispatch with publish on; never a pull request or a build-only dispatch), so
# setting a secret alone does not turn signing on. AOP_SIGN_RELEASES must be a repository variable,
# not an environment one: it decides whether the packaging jobs enter the release environment.
#
# Every secret lives in the `release` environment: only v* tags may deploy to it, and each run
# waits for the maintainer's approval there. Only the release job always enters it; the packaging
# jobs enter it only when they sign. A publishing dispatch must therefore run from a v* tag.
# To sign, set the variable and make sure these environment secrets exist; no workflow change is needed:
#   macOS:   AOP_MACOS_CERTIFICATE_P12_BASE64, AOP_MACOS_CERTIFICATE_PASSWORD,
#            AOP_MACOS_SIGN_IDENTITY, AOP_MACOS_NOTARIZE, APPLE_ID, APPLE_TEAM_ID,
#            APPLE_APP_SPECIFIC_PASSWORD
#   Windows: AOP_WINDOWS_PFX_BASE64, AOP_WINDOWS_PFX_PASSWORD
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref whose source should be packaged
        required: false
        type: string
      publish:
        description: Publish the GitHub Release and deploy to R2. Leave off to only build the artifacts.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/**"
      - "scripts/desktop/**"
      - "scripts/installer/**"
      - "scripts/release/**"

permissions:
  contents: read

env:
  CHECKOUT_REF: ${{ inputs.release_ref || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      # Cross-compiles the 4 host binaries (linux/darwin x x64/arm64) + runtime-assets.tar.gz.
      - run: bun run build:release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: dist/release
          retention-days: 1

  package-macos:
    needs: build
    runs-on: macos-latest
    # Signing secrets live in the release environment; an unsigned or pull request run enters none.
    environment: ${{ ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && vars.AOP_SIGN_RELEASES == 'true') && 'release' || '' }}
    env:
      SIGN_RELEASE: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && vars.AOP_SIGN_RELEASES == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist/release

      # TODO(signing): set the AOP_SIGN_RELEASES variable (see the top of this file) to sign. Until
      # then this step is skipped and the DMGs are unsigned, so macOS Gatekeeper warns on first open.
      - name: Import Apple Developer ID certificate
        if: env.SIGN_RELEASE == 'true'
        env:
          AOP_MACOS_CERTIFICATE_P12_BASE64: ${{ env.SIGN_RELEASE == 'true' && secrets.AOP_MACOS_CERTIFICATE_P12_BASE64 || '' }}
          AOP_MACOS_CERTIFICATE_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && secrets.AOP_MACOS_CERTIFICATE_PASSWORD || '' }}
          AOP_MACOS_KEYCHAIN_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && secrets.AOP_MACOS_KEYCHAIN_PASSWORD || '' }}
        run: |
          if [ -z "${AOP_MACOS_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "AOP_SIGN_RELEASES is on but no Apple certificate is configured." >&2
            exit 1
          fi

          KEYCHAIN_PASSWORD="${AOP_MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          KEYCHAIN_PATH="$RUNNER_TEMP/aop-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/aop-signing.p12"

          echo "$AOP_MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$AOP_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # TODO(notarization): set AOP_MACOS_NOTARIZE=1 with APPLE_ID, APPLE_TEAM_ID and
      # APPLE_APP_SPECIFIC_PASSWORD to have Apple notarize the DMGs.
      - name: Package macOS DMGs
        env:
          AOP_MACOS_SIGN_IDENTITY: ${{ env.SIGN_RELEASE == 'true' && secrets.AOP_MACOS_SIGN_IDENTITY || '' }}
          AOP_MACOS_NOTARIZE: ${{ env.SIGN_RELEASE == 'true' && secrets.AOP_MACOS_NOTARIZE || '' }}
          APPLE_ID: ${{ env.SIGN_RELEASE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ env.SIGN_RELEASE == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: bun run package:macos-dmg -- --version "${{ needs.build.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            dist/release/aop-macos-x64.dmg
            dist/release/aop-macos-arm64.dmg
          retention-days: 1

  # The Windows app is a client of a host: it bundles the dashboard and carries no server, so this
  # job needs neither the host binaries nor any cross-compilation.
  package-windows:
    needs: build
    runs-on: windows-latest
    # Signing secrets live in the release environment; an unsigned or pull request run enters none.
    environment: ${{ ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && vars.AOP_SIGN_RELEASES == 'true') && 'release' || '' }}
    env:
      SIGN_RELEASE: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && vars.AOP_SIGN_RELEASES == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # TODO(signing): set the AOP_SIGN_RELEASES variable, with AOP_WINDOWS_PFX_BASE64 and
      # AOP_WINDOWS_PFX_PASSWORD, to Authenticode-sign the installer. Until then it is unsigned, so
      # Windows SmartScreen warns on first run.
      - name: Package Windows desktop installer
        env:
          AOP_WINDOWS_PFX_BASE64: ${{ env.SIGN_RELEASE == 'true' && secrets.AOP_WINDOWS_PFX_BASE64 || '' }}
          AOP_WINDOWS_PFX_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && secrets.AOP_WINDOWS_PFX_PASSWORD || '' }}
        run: bun run package:windows -- --version "${{ needs.build.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            dist/release/aop-windows-x64-setup.exe
            dist/release/latest.yml
            dist/release/aop-windows-x64-setup.exe.blockmap
          retention-days: 1

  # Puts the pieces together and checks that exactly the expected set exists. This is the last step
  # a pull request reaches.
  assemble:
    needs: [build, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos
          path: dist/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: dist/release

      - name: Check the artifact set
        run: |
          for name in aop-linux-x64 aop-linux-arm64 aop-darwin-x64 aop-darwin-arm64 \
            aop-macos-x64.dmg aop-macos-arm64.dmg aop-windows-x64-setup.exe runtime-assets.tar.gz \
            latest.yml aop-windows-x64-setup.exe.blockmap; do
            if [ ! -s "dist/release/$name" ]; then
              echo "Missing or empty release artifact: $name" >&2
              exit 1
            fi
          done
          # Windows never hosts: a server or CLI build for it means an old target crept back in.
          if [ -e dist/release/aop-windows-x64.exe ]; then
            echo "Unexpected Windows host binary: aop-windows-x64.exe" >&2
            exit 1
          fi

      # The installed Windows app updates itself from latest.yml on getaop.com, so a
      # latest.yml that names another file, another version or another hash than the installer in
      # this run would strand every installed app. The file is printed so the log shows the config.
      - name: Check the Windows updater config
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat dist/release/latest.yml
          fail() { echo "latest.yml check failed: $1" >&2; exit 1; }
          grep -Eq "^version: ['\"]?${EXPECTED_VERSION}['\"]?$" dist/release/latest.yml \
            || fail "version is not ${EXPECTED_VERSION}"
          grep -Eq "^path: aop-windows-x64-setup.exe$" dist/release/latest.yml \
            || fail "path is not aop-windows-x64-setup.exe"
          grep -Eq "^ +- url: aop-windows-x64-setup.exe$" dist/release/latest.yml \
            || fail "files does not list aop-windows-x64-setup.exe"
          expected="$(awk '/^sha512: /{print $2; exit}' dist/release/latest.yml)"
          [ -n "$expected" ] || fail "no sha512"
          actual="$(openssl dgst -sha512 -binary dist/release/aop-windows-x64-setup.exe | base64 | tr -d '\n')"
          [ "$expected" = "$actual" ] || fail "sha512 does not match the installer in this run"
          echo "latest.yml matches aop-windows-x64-setup.exe ${EXPECTED_VERSION}"

      - name: Generate release checksums
        run: bun run ./scripts/release/checksums.ts dist/release

      - name: List release artifacts
        run: |
          ls -l dist/release
          cat dist/release/checksums.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-all
          path: |
            dist/release/aop-linux-x64
            dist/release/aop-linux-arm64
            dist/release/aop-darwin-x64
            dist/release/aop-darwin-arm64
            dist/release/aop-macos-x64.dmg
            dist/release/aop-macos-arm64.dmg
            dist/release/aop-windows-x64-setup.exe
            dist/release/latest.yml
            dist/release/aop-windows-x64-setup.exe.blockmap
            dist/release/runtime-assets.tar.gz
            dist/release/checksums.sha256
          retention-days: 1

  # Never runs for a pull request or a build-only dispatch.
  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in the release environment, which only v* tags may enter and which
    # waits for the maintainer's approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-all
          path: dist/release

      # Generated against the previous release by version: GitHub's own guess compares with an
      # older tag, because release tags are never ancestors of each other here. The same notes
      # go on the GitHub Release and into the feed.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run ./scripts/release/release-notes.ts "${{ needs.build.outputs.tag }}" "${{ github.repository }}" dist/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: AOP ${{ needs.build.outputs.tag }}
          body_path: dist/release-notes.md
          files: |
            dist/release/aop-linux-x64
            dist/release/aop-linux-arm64
            dist/release/aop-darwin-x64
            dist/release/aop-darwin-arm64
            dist/release/aop-macos-x64.dmg
            dist/release/aop-macos-arm64.dmg
            dist/release/aop-windows-x64-setup.exe
            dist/release/latest.yml
            dist/release/aop-windows-x64-setup.exe.blockmap
            dist/release/runtime-assets.tar.gz
            dist/release/checksums.sha256

      # Uploads the versioned artifacts, then the release feed, then the install script stamped
      # with this version. See scripts/release/deploy-r2.sh.
      - name: Deploy release assets to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AOP_RELEASES_R2_BUCKET: ${{ secrets.AOP_RELEASES_R2_BUCKET }}
        run: bash scripts/release/deploy-r2.sh "${{ needs.build.outputs.version }}"
