name: Release

# Full AOP release: builds linux/darwin/windows binaries, signs + notarizes the
# macOS DMGs, packages the Windows NSIS installer, publishes the GitHub Release,
# and deploys artifacts + the latest/version pointer to Cloudflare R2 (and the
# legacy SSH host on tag pushes).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref whose source should be packaged
        required: false
        type: string

permissions:
  contents: write

env:
  CHECKOUT_REF: ${{ inputs.release_ref || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      # Cross-compiles all 6 CLI binaries (linux/darwin/windows) + runtime-assets.tar.gz.
      - run: bun run build:release

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-binaries
          path: dist/release
          retention-days: 1

  package-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries
          path: dist/release

      - name: Import Apple Developer ID certificate
        env:
          AOP_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.AOP_MACOS_CERTIFICATE_P12_BASE64 }}
          AOP_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.AOP_MACOS_CERTIFICATE_PASSWORD }}
          AOP_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.AOP_MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${AOP_MACOS_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "No Apple certificate configured; macOS DMGs will be unsigned."
            exit 0
          fi

          KEYCHAIN_PASSWORD="${AOP_MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          KEYCHAIN_PATH="$RUNNER_TEMP/aop-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/aop-signing.p12"

          echo "$AOP_MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$AOP_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package macOS DMGs
        env:
          AOP_MACOS_SIGN_IDENTITY: ${{ secrets.AOP_MACOS_SIGN_IDENTITY }}
          AOP_MACOS_NOTARIZE: ${{ secrets.AOP_MACOS_NOTARIZE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bun run package:macos-dmg -- --version "${{ needs.build.outputs.version }}"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos
          path: |
            dist/release/aop-macos-x64.dmg
            dist/release/aop-macos-arm64.dmg
          retention-days: 1

  package-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries
          path: dist/release

      - name: Prime Bun Linux cross-compile target
        shell: pwsh
        run: |
          # Bun cannot extract cross-compile targets when the project is on the runner's D: drive.
          $primeDir = Join-Path $env:SystemDrive "aop-bun-cross-compile"
          Remove-Item $primeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $primeDir | Out-Null
          Set-Content -Path (Join-Path $primeDir "index.ts") -Value "console.log('aop')"
          Push-Location $primeDir
          try {
            bun build index.ts --compile --target=bun-linux-x64 --outfile aop-cross-compile-prime
          } finally {
            Pop-Location
            Remove-Item $primeDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows installer inputs
        run: bun run build:release -- --target linux-x64

      - name: Package Windows installer
        env:
          AOP_WINDOWS_PFX_BASE64: ${{ secrets.AOP_WINDOWS_PFX_BASE64 }}
          AOP_WINDOWS_PFX_PASSWORD: ${{ secrets.AOP_WINDOWS_PFX_PASSWORD }}
        run: bun run package:windows -- --version "${{ needs.build.outputs.version }}"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-windows
          path: dist/release/aop-windows-x64-setup.exe
          retention-days: 1

  release:
    needs: [build, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Reassemble the full artifact set produced across the build/package jobs.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries
          path: dist/release

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-macos
          path: dist/release

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-windows
          path: dist/release

      - name: Generate release checksums
        run: bun run ./scripts/release/checksums.ts dist/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: AOP ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/release/aop-linux-x64
            dist/release/aop-linux-arm64
            dist/release/aop-darwin-x64
            dist/release/aop-darwin-arm64
            dist/release/aop-windows-x64.exe
            dist/release/aop-windows-x64-setup.exe
            dist/release/aop-macos-x64.dmg
            dist/release/aop-macos-arm64.dmg
            dist/release/runtime-assets.tar.gz
            dist/release/checksums.sha256

      - name: Deploy release assets to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AOP_RELEASES_R2_BUCKET: ${{ secrets.AOP_RELEASES_R2_BUCKET }}
        run: bash scripts/release/deploy-r2.sh "${{ needs.build.outputs.version }}"

      - name: Deploy to legacy SSH host
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GETAOP_DEPLOY_HOST: ${{ secrets.GETAOP_DEPLOY_HOST }}
          GETAOP_DEPLOY_USER: ${{ secrets.GETAOP_DEPLOY_USER }}
          GETAOP_DEPLOY_SSH_KEY: ${{ secrets.GETAOP_DEPLOY_SSH_KEY }}
          GETAOP_DEPLOY_PATH: ${{ secrets.GETAOP_DEPLOY_PATH }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/release/deploy-getaop.sh "$VERSION"
