[package]
name = "aop-desktop"
version = "0.2.6"
description = "AOP desktop app"
authors = ["AOP"]
edition = "2024"
license = "MIT"

[lib]
name = "aop_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }

