document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pointer;background:{{ r.bg }};border:1px solid {{ r.bd }};border-radius:11px;padding:11px 12px;\">\n                <div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ r.dot }};\"><\u002Fspan><span style=\"font:600 12.5px 'Instrument Sans';\">{{ r.label }}<\u002Fspan><span style=\"margin-left:auto;font:500 10.5px 'Geist Mono';color:var(--subtle);\">{{ r.dur }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font:500 11px 'Geist Mono';color:var(--subtle);margin-top:5px;\">{{ r.steps }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ td.runsEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:24px 8px;text-align:center;font:500 12.5px 'Instrument Sans';color:var(--subtle);\">No executions yet. Continue the task to start the first run.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;\">\n          <div style=\"padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;\"><span style=\"font:600 14px 'Jura',sans-serif;\">{{ td.activeRunLabel }}<\u002Fspan><span style=\"font:500 11.5px 'Geist Mono';color:var(--subtle);\">{{ td.activeRunSub }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ td.hasRun }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"aop-scroll\" style=\"flex:1;overflow-y:auto;padding:16px 18px;font:500 12.5px 'Geist Mono';line-height:1.7;color:var(--muted);\">\n              <sc-for list=\"{{ td.logLines }}\" as=\"l\" hint-placeholder-count=\"6\"><div style=\"display:flex;gap:12px;\"><span style=\"color:var(--subtle);flex-shrink:0;\">{{ l.t }}<\u002Fspan><span style=\"color:{{ l.color }};\">{{ l.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n n    tasks: this.seedTasks(),\n    backlog: this.seedBacklog(),\n    reviewItems: this.seedReview(),\n  };\n\n  seedReview(){\n    return [\n      { id:\"rv1\", worker:\"k3\", sev:\"high\", taskStatus:\"blocked\", title:\"Review: worker profile API\", reason:\"The generated contract changes a public field. Needs your call before it runs.\", time:\"4m ago\" },\n      { id:\"rv2\", worker:\"k1\", sev:\"med\", taskStatus:\"blocked\", title:\"Nuclear review failed · metrics refactor\", reason:\"Complexity bar not met — 2 functions over the threshold. Approve a fix round or take over.\", time:\"22m ago\" },\n      { id:\"rv3\", worker:\"k4\", sev:\"low\", taskStatus:\"draft\", title:\"Approve plan · Split KanbanBoard.tsx\", reason:\"Plan is ready and waiting on your go-ahead to start implementation.\", time:\"1h ago\" },\n    ];\n  }\n\n  REPOS = [\n    { id:\"aop-mono\", name:\"aop-mono\", path:\"/Users/marcelorm/workspace/aop-mono\" },\n    { id:\"aop-web\", name:\"aop-web\", path:\"/Users/marcelorm/workspace/aop-web\" },\n  ];\n  RUNTIMES = [\n    { id:\"claude\", label:\"Claude Code\", cmd:\"claude\", glyph:\"CL\", color:\"var(--amber)\", models:[[\"claude-opus-4-8\",\"Opus 4.8\"],[\"claude-sonnet-4-8\",\"Sonnet 4.8\"],[\"claude-haiku-4-5\",\"Haiku 4.5\"]], skills:[\"commit\",\"changelog\",\"review-pr\",\"write-tests\"] },\n    { id:\"codex\", label:\"Codex\", cmd:\"codex\", glyph:\"CX\", color:\"var(--sky)\", models:[[\"gpt-5.5\",\"GPT-5.5\"],[\"gpt-5.5-fast\",\"GPT-5.5 Fast\"],[\"o5-mini\",\"o5-mini\"]], skills:[\"fix-ci\",\"migration-plan\",\"write-tests\"] },\n    { id:\"cursor\", label:\"Cursor CLI\", cmd:\"cursor-cli\", glyph:\"CU\", color:\"var(--lav)\", models:[[\"composer-3\",\"Composer 3\"],[\"gpt-5.5\",\"GPT-5.5\"]], skills:[\"bugbot\",\"refactor-map\"] },\n    { id:\"pi\", label:\"PI\", cmd:\"pi\", glyph:\"PI\", color:\"var(--mint)\", models:[[\"gpt-5.5\",\"GPT-5.5\"],[\"kimi-k2.6\",\"Kimi 2.6\"]], skills:[\"deep-research\",\"summarize-repo\"] },\n    { i :\"t1\", worker:\"k1\", col:\"inprogress\", status:\"working\", phase:\"Implementing…\", title:\"Redesign metrics cards\", desc:\"Apply the new token system to the metrics grid.\" },\n      { id:\"t2\", worker:\"k1\", col:\"todo\", status:\"draft\", title:\"Empty-state for Review\", desc:\"Friendlier copy + illustration.\" },\n      { id:\"t3\", worker:\"k1\", col:\"done\", status:\"done\", title:\"Sidebar nav polish\", desc:\"Active states + spacing.\", pr:{ state:\"merged\", num:1284, at:\"2h\" } },\n      { id:\"t4\", worker:\"k2\", col:\"inprogress\", status:\"working\", phase:\"Running tests…\", title:\"Postit assign endpoint\", desc:\"Wire assignment + planning trigger.\" },\n      { id:\"t5\", worker:\"k2\", col:\"done\", status:\"done\", title:\"SSE reconnect backoff\", desc:\"\", pr:{ state:\"open\", num:1290 } },\n      { id:\"t6\", worker:\"k3\", col:\"todo\", status:\"blocked\", title:\"Review: worker profile API\", desc:\"Needs your input on the contract.\" },\n      { id:\"t7\", worker:\"k4\", col:\"todo\", status:\"planning\", phase:\"Generating plan…\", title:\"Split KanbanBoard.tsx\", desc:\"Over the 500-line budget.\" },\n      { id:\"t8\", worker:\"k4\", col:\"done\", status:\"done\", title:\"Extract swimlane header\", desc:\"\", pr:{ state:\"none\" } },\n      { id:\"t9\", worker:\"k5\", col:\"done\", status:\"done\", title:\"Audit step-library types\", desc:\"\", pr:{ state:\"ci\", num:1288 } },\n      { id:\"t10\", worker:\"k6\", col:\"inprogress\", status:\"working\", phase:\"Debugging…\", title:\"Fix flaky drop test\", desc:\"kanban-board-drops.test.ts\" },\n      { id:\"t11\", worker:\"k1\", col:\"done\", status:\"done\", title:\"Token migration: badges\", desc:\"\", pr:{ state:\"merged\", num:1276, at:\"1d\" } },\n      { id:\"t12\", worker:\"k2\", col:\"todo\", status:\"draft\", title:\"Jira import polling\", desc:\"Cadence + secure tokens.\" },\n      { id:\"t13\", worker:\"k6\", col:\"todo\", status:\"planning\", phase:\"Generating plan…\", title:\"Fix flaky worktree teardown\", desc:\"Serialize pool teardown; key dirs by runner id.\" },\n    ];\n  }\n  seedBacklog(){\n    return [\n      { id:\"b1\", title:\"Dark mode for task detail\", desc:\"The plan page is hard to read.\" },\n      { id:\"b2\", title:\"Bulk-archive done cards\", desc:\"One click to clear the Done column.\" },\n    ];\n  }\n\n  // ---------- helpers ----------\n  avatar(color){ return this.AVATARS[color] || this.AVATARS.teal; }\n  jobOf(id){ return this.JOBS.find(j=>j.id===id) || this.JOBS[0]; }\n  thinkLabel(v){ const m=this.THINKING.find(t=>t[0]===v); return m?m[1]:v; }\n  provLabel(id){ const p=this.PROVIDERS.find(x=>x.id===id); return p?p.label:id; }\n  workerById(id){ return this.state.workers.find(w=>w.id===id); }\n  toast(m){ this.setState({toast:m}); clearTimeout(this._t); this._t=setTimeout(()=>this.setState({toast:null}),2200); }\n  closeMenu(){ this.setState({menu:null}); }\n\n  tasksFor(wid){ return this.state.tasks.filter(t=>t.worker===wid); }\n  matchesSearch(text){ const q=this.state.poolSearch.trim().toLowerCase(); return !q || String(text).toLowerCase().includes(q); }\n\n  statusMeta(status){\n    const d=this.state.theme;\n    const map={\n      draft:{tag:\"To do\",bg:\"color-mix(in srgb,var(--subtle) 14%,transparent)\",fg:\"var(--subtle)\"},\n      ready:{tag:\"Ready\",bg:\"var(--readyFill)\",fg:\"var(--ready)\"},\n      planning:{tag:\"Planning\",bg:\"var(--readyFill)\",fg:\"var(--ready)\",spin:true,phase:\"Generating plan\"},\n      working:{tag:\"Working\",bg:\"var(--workFill)\",fg:\"var(--work)\",spin:true,phase:\"Running\"},\n      blocked:{tag:\"Needs you\",bg:\"var(--badFill)\",fg:\"var(--bad)\"},\n      paused:{tag:\"Paused\",bg:\"var(--readyFill)\",fg:\"var(--ready)\"},\n      done:{tag:\"Done\",bg:\"var(--okFill)\",fg:\"var(--ok)\"},\n    };\n    return map[status]||map.draft;\n  }\n  workerStatus(wid){\n    const ts=this.tasksFor(wid);\n    if(ts.some(t=>t.status===\"blocked\"||t.status===\"paused ().toString(36).slice(2,6);\n      this.setState(s=>({ tasks:[{id:u,worker:c.assignTo,col:\"todo\",status:\"planning\",phase:\"Generating plan…\",title:c.title,desc:c.desc},...s.tasks], composerOpen:false }));\n      this.toast(\"Assigned to \"+this.workerById(c.assignTo).name+\" — drafting plan\");\n    } else {\n      const u=\"b\"+Math.random().toString(36).slice(2,6);\n      this.setState(s=>({ backlog:[{id:u,title:c.title,desc:c.desc},...s.backlog], composerOpen:false }));\n      this.toast(\"Added to backlog\");\n    }\n  }\n  assignBacklog(cardId, workerId){\n    const card=this.state.backlog.find(b=>b.id===cardId);\n    const w=this.workerById(workerId);\n    if(!card||!w){ this.setState({dragCard:null,dragOverWorker:null,menu:null}); return; }\n    const u=\"t\"+Math.random().toString(36).slice(2,6);\n    this.setState(s=>({\n      tasks:[{id:u,worker:workerId,col:\"todo\",status:\"planning\",phase:\"Generating plan…\",title:card.title,desc:card.desc},...s.tasks],\n      backlog:s.backlog.filter(b=>b.id!==cardId),\n      dragCard:null, dragOverWorker:null, menu:null\n    }));\n    this.toast(\"Assigned to \"+w.name+\" — drafting plan\");\n  }\n\n  // ---------- sessions / chat ----------\n  seedSessions(){\n    return [\n      { id:\"s1\", repo:\"aop-mono\", title:\"Flaky worktree teardown\", runtime:\"claude\", model:\"claude-opus-4-8\", effort:\"high\", updated:\"12m\",\n        messages:[\n          { role:\"user\", segs:[{k:\"t\",t:\"morning — anything red on aop-mono before standup?\"}] },\n          { role:\"assistant\", text:\"Mostly green. 42 checks passing, one flaky: worktree-pool teardown fails about 1 in 5 CI runs, always on the parallel matrix. Nothing else needs you.\" },\n          { role:\"user\", segs:[{k:\"t\",t:\"quick one — why do the worktree pool tests flake on CI but pass locally?\"}] },\n          { role:\"assistant\", text:\"Two runners share TMPDIR on CI, so teardown occasionally deletes a sibling's checkout. Locally you run a sing
